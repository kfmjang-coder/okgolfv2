<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f14">
<link rel="manifest" href="/manifest.json">
<title>OK골프 레슨 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1f14; --bg2:#0f2b1c; --card:#13371f; --line:#1f4a30;
    --accent:#b6ff3c; --accent-d:#08210f; --accent2:#5fd97a;
    --ink:#eaf6ec; --mut:#8fb39a; --off:#2a4636;
  }
  body[data-theme="light"]{
    --bg:#f4f7f2; --bg2:#ffffff; --card:#ffffff; --line:#d8e3d5;
    --accent:#3b8a1e; --accent-d:#ffffff; --accent2:#4fa733;
    --ink:#1a2e1f; --mut:#6b806f; --off:#c5d3c2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overscroll-behavior-y:contain}
  body{font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    overscroll-behavior-y:contain;
    min-height:100dvh;background-image:radial-gradient(120% 80% at 80% -10%,#1a4e2e 0,transparent 55%),
    radial-gradient(90% 60% at -10% 110%,#0d3a22 0,transparent 50%)}
  .config-warn{background:#3a2f08;color:#ffe08a;font-size:13px;padding:10px 16px;line-height:1.5}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
    background:rgba(10,31,20,.9);backdrop-filter:blur(10px)}
  .logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:1px;color:var(--accent)}
  .logo span{color:var(--ink)}
  .nav-user{font-size:13px;color:var(--mut)}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 90px}
  .view{display:none;animation:fade .35s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-family:'Bebas Neue';font-size:32px;letter-spacing:1px;margin-bottom:4px}
  h3{font-size:19px;margin:14px 0 8px}
  .sub{color:var(--mut);font-size:14px}
  .desc{color:var(--mut);font-size:15px;margin-bottom:20px}
  .mini-label{font-size:14px;color:var(--mut);margin:18px 0 8px}
  input,textarea,select{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg2);color:var(--ink);font-size:16px;font-family:inherit;margin-top:6px;min-height:48px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  label{font-size:14px;color:var(--mut)}
  .btn-primary{width:100%;padding:16px;border:none;border-radius:12px;background:var(--accent);
    color:var(--accent-d);font-weight:800;font-size:17px;cursor:pointer;margin-top:14px;transition:transform .1s;min-height:50px}
  .btn-primary:active{transform:scale(.98)}
  .btn-primary:disabled{background:var(--off);color:var(--mut);cursor:not-allowed}
  .btn-ghost{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;
    background:transparent;color:var(--ink);font-size:16px;cursor:pointer;margin-top:10px;font-family:inherit;min-height:48px}
  .btn-google{background:#fff;color:#222;border:none}
  .hide{display:none}
  /* 카드류 */
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent2);color:var(--accent-d);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .rebook-card{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px}
  .rebook-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .rebook-head .sub{margin-top:2px}
  .up-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .up-time{color:var(--accent);font-size:15px;font-weight:700;margin-top:4px}
  /* STEP1 */
  .pick-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
    color:var(--ink);font-family:inherit}
  .pick-card.on{border-color:var(--accent);background:#16401f}
  .chip{display:inline-block;padding:11px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg2);color:var(--ink);font-size:14px;cursor:pointer;margin:0 8px 8px 0;font-family:inherit}
  .chip.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700}
  /* STEP2 날짜바 */
  /* 월 캘린더 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-title{font-size:16px;font-weight:700}
  .cal-nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    color:var(--ink);font-size:20px;cursor:pointer;font-family:inherit}
  .cal-nav:active{background:var(--card)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
  .cal-dow.sun{color:#ff9b9b}
  .cal-dow.sat{color:#9bc4ff}
  .cal-day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--bg2);
    color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;padding:0}
  .cal-day.sun{color:#ff9b9b}
  .cal-day.sat{color:#9bc4ff}
  .cal-day:active{background:var(--card)}
  .cal-day.sel{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:800}
  .cal-day.past{opacity:.3;border-color:transparent;background:transparent;cursor:default}
  /* 시간대 접기 */
  .zone{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .zone.dim{opacity:.5}
  .zone-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
    cursor:pointer;font-size:15px;font-weight:500}
  .zone-cnt{font-size:13px;color:var(--mut)}
  .zone.expanded{border-color:var(--accent2)}
  .zone.expanded .zone-cnt{color:var(--accent2)}
  .zone-body{display:none;padding:0 16px 16px;grid-template-columns:repeat(3,1fr);gap:8px}
  .zone.expanded .zone-body{display:grid}
  .slot{padding:13px 0;border-radius:10px;border:none;font-size:15px;font-weight:500;cursor:pointer;
    background:var(--accent2);color:var(--accent-d);font-family:inherit}
  .slot.off{background:var(--bg2);color:var(--mut);text-decoration:line-through;cursor:not-allowed}
  /* 확정 */
  .cf-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .cf-row{display:flex;justify-content:space-between;padding:9px 0;font-size:15px}
  .cf-row span{color:var(--mut)}
  .field{margin-bottom:12px}
  /* 완료 */
  .done-check{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-d);
    font-size:34px;display:flex;align-items:center;justify-content:center;margin:10px auto 14px;font-weight:800}
  .done-detail{text-align:center;margin:14px 0}
  .done-time{color:var(--accent);font-size:18px;font-weight:700;margin-top:6px}
  .hint{color:var(--mut);font-size:14px;padding:16px 0;text-align:center}
  .hint.sm{padding:8px 0;font-size:13px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .back{background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;padding:0 4px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--line);
    background:rgba(10,31,20,.95);backdrop-filter:blur(10px);max-width:480px;margin:0 auto}
  nav button{flex:1;padding:13px 2px;background:none;border:none;color:var(--mut);font-size:13px;
    cursor:pointer;font-family:inherit;white-space:nowrap;min-height:54px}
  nav button.on{color:var(--accent);font-weight:700}
  /* 게시판 */
  .post-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .post-card.pinned{border-color:var(--accent);background:#16401f}
  .post-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .post-cat{font-size:12px;color:var(--accent2);background:var(--bg2);padding:3px 10px;border-radius:999px}
  .post-title{font-size:17px;font-weight:700;margin-bottom:6px}
  .post-body{font-size:15px;color:#cfe6d4;white-space:pre-wrap;line-height:1.55}
  .post-meta{font-size:12px;color:var(--mut);margin-top:10px}
  .post-actions{display:flex;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .like-btn,.cmt-toggle{background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
  .like-btn span:first-child{color:#ff9b9b}
  .cmt-area{margin-top:12px}
  .cmt{padding:10px;border-radius:10px;background:var(--bg2);margin-bottom:8px;font-size:14px}
  .cmt.staff{border:1px solid var(--accent2)}
  .staff-badge{font-size:10px;background:var(--accent2);color:var(--accent-d);padding:1px 6px;border-radius:999px}
  .cmt-del{float:right;background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px}
  .cmt-write{display:flex;gap:8px;margin-top:8px}
  .cmt-write input{margin-top:0}
  .cmt-write button{padding:0 16px;border-radius:10px;border:none;background:var(--accent);
    color:var(--accent-d);font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .recur-toggle{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0;font-size:15px}
  .authed-only{display:none}
  body.authed .authed-only{display:flex}
  /* 내 예약 카드 */
  .bk-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .bk-card.dim{opacity:.5}
  .bk-top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
  .bk-badge{font-size:12px;color:var(--mut);background:var(--bg2);padding:3px 10px;border-radius:999px}
  .bk-time{color:var(--accent);font-size:15px;font-weight:700;margin-top:6px}
  .cancel-btn{margin-top:12px;width:100%;padding:11px;border:1px solid #6b2b2b;border-radius:10px;
    background:transparent;color:#ff9b9b;font-size:14px;cursor:pointer;font-family:inherit}
  .cancel-btn:active{background:#3a1a1a}
  /* 관리자 */
  .admin-only{display:none}
  body.is-admin .admin-only{display:block}
  .admin-tabs{display:flex;gap:8px;margin-top:10px}
  .admin-tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);color:var(--mut);font-size:14px;cursor:pointer;font-family:inherit}
  .admin-tabs button.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700}
  .as-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .as-slot{padding:11px 0;border-radius:10px;border:1px solid var(--line);font-size:13px;
    cursor:pointer;font-family:inherit;font-weight:500}
  .as-slot.closed{background:var(--bg2);color:var(--mut)}
  .as-slot.open{background:var(--accent2);color:var(--accent-d);border-color:var(--accent2)}
  .as-slot.booked{background:#5a2424;color:#ffb3b3;border-color:#6b2b2b;cursor:not-allowed}
  .as-slot.blocked{background:#3a2f08;color:#caa84a;border-color:#5c4a12;cursor:not-allowed;text-decoration:line-through}
  .block-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .dow-pick{display:flex;gap:6px;margin-top:10px;justify-content:space-between}
  .dow-chip{flex:1;cursor:pointer}
  .dow-chip input{display:none}
  .dow-chip span{display:block;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--bg2);color:var(--mut);font-size:14px}
  .dow-chip input:checked+span{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700}
  .alert-banner{background:var(--bg2);border:1px solid var(--accent2);border-left:4px solid var(--accent2);
    border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.5}
  .alert-banner.today{border-color:var(--accent);border-left-color:var(--accent);background:var(--card)}
  .cal-toggle-btn{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cal-toggle-btn.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700}
  .my-cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:14px;color:var(--ink);border-radius:10px;gap:2px;position:relative}
  .my-cal-day.has{cursor:pointer;background:var(--bg2)}
  .my-cal-day.today{border:1px solid var(--accent)}
  .cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .cal-dot.upcoming{background:var(--accent)}
  .cal-dot.done{background:var(--mut)}
  .cal-dot.cancelled{background:#ff9b9b}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--mut)}
  .cal-legend span{display:flex;align-items:center;gap:5px}
  .bk-card.flash{animation:flashHl 1.5s ease}
  .pass-row{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .pass-row:last-child{border-bottom:none}
  .pro-thumb{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:0 0 auto}
  .pro-photo-lg{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
  .avatar.lg{width:96px;height:96px;border-radius:50%;font-size:32px;display:inline-flex;align-items:center;justify-content:center}
  .pro-card{cursor:pointer}
  .pro-card .chev{color:var(--mut);font-size:22px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal.hide{display:none}
  .modal-card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
  .pass-card{background:var(--card);border:1px solid var(--accent2);border-left:4px solid var(--accent);
    border-radius:14px;padding:14px 16px;margin-bottom:8px}
  .pass-card .pass-rem{margin-top:6px;font-size:15px}
  .pass-card .pass-rem b{color:var(--accent);font-size:22px}
  .pass-pick{justify-content:space-between !important}
  .pass-pick.on{border-color:var(--accent);background:var(--card)}
  @keyframes flashHl{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 3px var(--accent)}}
  .att-badge{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px}
  .att-badge.ok{background:#16401f;color:var(--accent)}
  .att-badge.no{background:#5a2424;color:#ffb3b3}
  .att-btns{display:flex;gap:8px;margin-top:12px}
  .att-btn{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .att-btn.ok{background:var(--accent);color:var(--accent-d)}
  .att-btn.no{background:transparent;border:1px solid #6b2b2b;color:#ff9b9b}
  .journal-box{background:var(--bg2);border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
  .rating-input{margin-top:12px;text-align:center}
  .stars{font-size:28px;letter-spacing:4px;margin-top:4px}
  .star{cursor:pointer;color:var(--accent)}
  .star:active{transform:scale(1.2)}
  .rating-done{margin-top:10px;color:var(--accent);font-size:15px;text-align:center}
  .mini-btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
    color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;min-height:38px}
  .mini-btn.danger{color:#ff9b9b;border-color:#6b2b2b}
</style>
</head>
<body>
<header>
  <div class="logo" id="storeLogo">OK골프</div>
  <div style="display:flex;align-items:center;gap:12px">
    <button id="themeBtn" onclick="toggleTheme()" style="background:none;border:none;font-size:20px;cursor:pointer">🌙</button>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<div class="wrap">
  <!-- 인증 확인 중 로딩 -->
  <section id="loadingView" class="view active">
    <div style="text-align:center;padding:80px 0;color:var(--mut)">
      <div class="logo" id="storeLogoLoading" style="font-size:40px;margin-bottom:16px">OK골프</div>
      <p>불러오는 중…</p>
    </div>
  </section>

  <!-- 로그인/가입 -->
  <section id="authView" class="view">
    <h2 id="authTitle">로그인</h2>
    <p class="desc">레슨 예약을 위해 로그인하세요.</p>
    <div id="signupFields" class="hide">
      <div class="field"><label>이름</label><input id="suName" placeholder="홍길동"></div>
      <div class="field"><label>연락처</label><input id="suPhone" placeholder="010-0000-0000"></div>
    </div>
    <div class="field"><label>이메일</label><input id="email" type="email" placeholder="you@email.com"></div>
    <div class="field"><label>비밀번호</label><input id="password" type="password" placeholder="6자 이상"></div>
    <button class="btn-primary" onclick="submitAuth()">계속</button>
    <button class="btn-ghost btn-google" onclick="googleLogin()">Google로 계속하기</button>
    <button class="btn-ghost" onclick="toggleAuth()">로그인 / 회원가입 전환</button>
  </section>

  <!-- 홈 -->
  <section id="homeView" class="view">
    <div id="alertBox"></div>
    <h2>예약</h2>
    <div id="upcomingBox"></div>
    <div id="myPassBox"></div>
    <div id="rebookBox"></div>
    <button class="btn-ghost" onclick="startNewBooking()" style="margin-top:16px">+ 다른 프로·시간으로 예약</button>
  </section>

  <!-- STEP1: 프로+레슨 -->
  <section id="step1View" class="view">
    <div class="topbar"><button class="back" onclick="show('homeView')">‹</button><h3 style="margin:0">이용권 선택</h3></div>
    <p class="sub" style="margin-bottom:10px">사용할 이용권을 선택하세요.</p>
    <div id="passPick"></div>

    <div class="recur-toggle" id="recurToggleBox" style="display:none">
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <span>🔁 반복 예약으로 등록</span>
        <input type="checkbox" id="recurOn" onchange="toggleRecurOptions()" style="width:auto;margin:0;transform:scale(1.3)">
      </label>
      <div id="recurOptions" class="hide" style="margin-top:14px">
        <p class="sub" style="margin-bottom:10px">선택한 이용권으로 매주 같은 요일·시간에 자동 예약합니다.</p>
        <div class="field"><label>요일</label>
          <select id="rcWeekday"><option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option></select></div>
        <div class="field"><label>시간</label><select id="rcTime"></select></div>
        <div class="field"><label>반복</label>
          <select id="rcEvery"><option value="1">매주</option><option value="2">격주</option></select></div>
        <div class="field"><label>기간</label>
          <select id="rcWeeks"><option value="4">4주</option><option value="8">8주</option><option value="12">12주</option></select></div>
      </div>
    </div>

    <button id="toStep2" class="btn-primary" onclick="step1Next()" disabled style="display:none">다음</button>
  </section>

  <!-- STEP2: 날짜+슬롯접기 -->
  <section id="step2View" class="view">
    <div class="topbar"><button class="back" onclick="show('step1View')">‹</button><h3 style="margin:0">시간 선택</h3></div>
    <p class="sub" id="s2Pro" style="margin-bottom:10px"></p>
    <div id="dateBar"></div>
    <div id="slotZones" style="margin-top:12px"></div>
  </section>

  <!-- 확정 -->
  <section id="confirmView" class="view">
    <div class="topbar"><button class="back" onclick="show('step2View')">‹</button><h3 style="margin:0">예약 확인</h3></div>
    <div class="cf-box" id="cfSummary"></div>
    <div class="field"><label>이름</label><input id="cfName"></div>
    <div class="field"><label>연락처</label><input id="cfPhone"></div>
    <div class="field"><label>인원</label>
      <select id="cfPeople"><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option></select></div>
    <div class="field"><label>요청사항(선택)</label><textarea id="cfRequest" rows="2"></textarea></div>
    <button id="cfBtn" class="btn-primary" onclick="confirmBooking()">예약 확정</button>
  </section>

  <!-- 완료 = 예약확인 통합 -->
  <section id="doneView" class="view">
    <div class="cf-box" id="doneCard" style="text-align:center"></div>
    <a id="calBtn" class="btn-ghost" style="display:block;text-align:center;text-decoration:none;line-height:1.4" target="_blank">📅 캘린더에 추가</a>
    <button class="btn-primary" onclick="show('homeView');renderHomeSafe()">홈으로</button>
  </section>

  <!-- 내 예약 목록 -->
  <section id="myView" class="view">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0">내 예약</h2>
      <button id="myCalToggle" class="cal-toggle-btn" onclick="toggleMyCalendar()">📅 달력으로 보기</button>
    </div>
    <div id="myCalBox" class="hide" style="margin-top:14px"></div>
    <div id="myList" style="margin-top:14px"></div>
  </section>

  <!-- 프로 편집 -->
  <section id="proEditView" class="view">
    <div class="topbar"><button class="back" onclick="adminTab('manage')">‹</button><h3 style="margin:0">프로 편집</h3></div>
    <div id="proEditPhoto" style="text-align:center;margin:10px 0"></div>
    <div class="field"><label>사진 URL (선택)</label>
      <input id="pedPhoto" placeholder="https://... 이미지 주소" oninput="proEditPhotoPreview()"></div>
    <div class="field"><label>이름</label><input id="pedName" placeholder="홍길동"></div>
    <div class="field"><label>직함</label><input id="pedTitle" placeholder="예: 대표프로, KPGA 프로"></div>
    <div class="field"><label>소개</label><textarea id="pedBio" rows="3" placeholder="간단한 자기소개"></textarea></div>
    <div class="field"><label>수상·경력 (한 줄에 하나씩)</label><textarea id="pedCareer" rows="4" placeholder="2020 KPGA 투어 우승&#10;前 OO컨트리클럽 소속"></textarea></div>
    <div class="field"><label>운영 시간</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="pedStart" style="flex:1"></select><span>~</span><select id="pedEnd" style="flex:1"></select>
      </div></div>
    <label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" id="pedActive" style="width:auto;margin:0"> 활성 (회원에게 노출)</label>
    <button class="btn-primary" onclick="saveProEdit()">저장</button>
    <button class="btn-ghost danger" onclick="deletePro()" style="margin-top:10px">이 프로 삭제</button>
  </section>

  <!-- 수강권 발급 모달 -->
  <div id="passModal" class="modal hide">
    <div class="modal-card">
      <h3 style="margin:0 0 14px">수강권 발급</h3>
      <div class="sub" id="passModalMember" style="margin-bottom:12px"></div>
      <div class="field"><label>담당 프로</label><select id="pmPro"></select></div>
      <div class="field"><label>레슨 종류</label><select id="pmLesson"></select></div>
      <div class="field"><label>총 횟수</label><input id="pmTotal" type="number" min="1" value="10"></div>
      <div class="field"><label>만료일 (선택)</label><input id="pmExpire" type="date"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn-ghost" onclick="closePassModal()" style="flex:1">취소</button>
        <button class="btn-primary" onclick="submitIssuePass()" style="flex:1">발급</button>
      </div>
    </div>
  </div>

  <!-- 관리자 콘솔 -->
  <section id="adminView" class="view">
    <h2>관리자</h2>
    <div id="adminTabs" class="admin-tabs">
      <button class="on" data-tab="status" onclick="adminTab('status')">현황</button>
      <button data-tab="slots" onclick="adminTab('slots')">슬롯</button>
      <button data-tab="members" onclick="adminTab('members')">회원</button>
      <button data-tab="manage" onclick="adminTab('manage')">설정</button>
    </div>
    <div id="adminBody" style="margin-top:14px"></div>
    <button class="btn-ghost" id="dayOpenBtn" onclick="openWholeDay()" style="margin-top:8px;display:none">⚡ 이 날짜 운영시간 전체 열기</button>
  </section>

  <!-- 게시판 -->
  <section id="boardView" class="view">
    <h2>게시판</h2>
    <div id="boardFilter" class="admin-tabs" style="flex-wrap:wrap">
      <button class="on" data-cat="all" onclick="setBoardFilter('all')">전체</button>
      <button data-cat="notice" onclick="setBoardFilter('notice')">공지</button>
      <button data-cat="free" onclick="setBoardFilter('free')">자유</button>
      <button data-cat="swing" onclick="setBoardFilter('swing')">질문</button>
    </div>
    <button class="btn-ghost" onclick="openPostWrite()" style="margin-top:10px">✏️ 글쓰기</button>
    <div id="postList" style="margin-top:14px"></div>
  </section>

  <!-- 글쓰기 -->
  <section id="postWriteView" class="view">
    <div class="topbar"><button class="back" onclick="openBoard()">‹</button><h3 style="margin:0">글쓰기</h3></div>
    <div class="field"><label>카테고리</label>
      <select id="pwCategory"><option value="free">자유</option><option value="swing">질문</option><option value="notice">공지</option></select></div>
    <div class="field"><label>제목</label><input id="pwTitle"></div>
    <div class="field"><label>내용</label><textarea id="pwContent" rows="5"></textarea></div>
    <label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="pwAnon" style="width:auto;margin:0"> 익명으로</label>
    <label class="admin-only" style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="pwPin" style="width:auto;margin:0"> 공지 상단 고정</label>
    <button class="btn-primary" id="pwSubmit" onclick="createPost()">등록</button>
  </section>

  <!-- (이용권 화면은 홈에 통합되어 제거됨) -->
</div>

<nav class="authed-only">
  <button class="on" onclick="show('homeView');renderHomeSafe();setTab(this)">예약</button>
  <button onclick="openMyBookings();setTab(this)">내 예약</button>
  <button onclick="openBoard();setTab(this)">게시판</button>
  <button class="admin-only" onclick="openAdmin();setTab(this)">관리</button>
  <button onclick="logout()">로그아웃</button>
</nav>

<script type="module" src="/js/app.js"></script>
<script>
  // 로그인 상태에 따라 하단 탭 노출
  const origShow = null;
  window.renderHomeSafe = () => { try { if (window.renderHome) window.renderHome(); } catch(e){} };
  window.setTab = (el) => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
    el.classList.add('on');
  };
  const mo = new MutationObserver(() => {
    const onAuth = document.getElementById('authView').classList.contains('active');
    const onLoading = document.getElementById('loadingView').classList.contains('active');
    document.body.classList.toggle('authed', !onAuth && !onLoading);
  });
  document.querySelectorAll('.view').forEach(v => mo.observe(v, { attributes:true, attributeFilter:['class'] }));
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body>
</html>
